# GitLab CI/CD for Buckets: build the images and push them to Harbor, then
# (on release tags, or by hand on main) move a MinIO tenant to Buckets and
# back on the shared cluster with those images.
#
#   harbor.os.harlandclarke.internal/vericast/bucketsd          (docker/Dockerfile.bucketsd)
#   harbor.os.harlandclarke.internal/vericast/buckets-operator  (docker/Dockerfile.operator)
#   harbor.os.harlandclarke.internal/vericast/buckets-console   (docker/Dockerfile.console)
#
# Tags pushed:
#   - branches main and the default branch: <short-sha> and <branch-slug>
#   - git tags:                              <tag without a leading v> and latest
#
# Required CI/CD variables (Settings > CI/CD > Variables), masked + protected:
#   HARBOR_USERNAME  Harbor robot account, e.g. robot$vericast+gitlab
#   HARBOR_PASSWORD  the robot account token
#
# The robot needs push on the "vericast" Harbor project. If the variables are
# protected, main must be a protected branch or they arrive empty.
#
# The round trip (stage e2e) needs the shared cluster, one of:
#   KUBE_CONTEXT     a GitLab agent's context (<agent project path>:<agent name>),
#                    once the agent's config lists this project under ci_access
#   KUBECONFIG       a File variable: a kubeconfig whose account may create and
#                    delete namespaces, patch PersistentVolumes and install the
#                    operator (CRDs and RBAC)
#   E2E_AVOID_NODES  optional: node names the test pods must not run on

stages:
  - build
  - e2e

variables:
  REGISTRY_HOST: harbor.os.harlandclarke.internal
  REGISTRY_PROJECT: $REGISTRY_HOST/vericast

default:
  tags:
    - sa1x-k8s-dev-1a

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# One job per image, built in parallel with Kaniko (no Docker daemon).
build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  timeout: 1h
  interruptible: true
  parallel:
    matrix:
      - REPOSITORY: bucketsd
        DOCKERFILE: docker/Dockerfile.bucketsd
      - REPOSITORY: buckets-operator
        DOCKERFILE: docker/Dockerfile.operator
      - REPOSITORY: buckets-console
        DOCKERFILE: docker/Dockerfile.console
      - REPOSITORY: buckets-kes
        DOCKERFILE: docker/Dockerfile.kes
  script:
    - |
      if [ -z "$HARBOR_USER" ] || [ -z "$HARBOR_PASSWORD" ]; then
        echo "ERROR: HARBOR_USER / HARBOR_PASSWORD are empty."
        echo "Set them in Settings > CI/CD > Variables. If they are 'Protected',"
        echo "either protect this branch/tag or untick Protected."
        exit 1
      fi
    - |
      AUTH=$(printf '%s:%s' "$HARBOR_USER" "$HARBOR_PASSWORD" | base64 | tr -d '\n')
      mkdir -p /kaniko/.docker
      cat > /kaniko/.docker/config.json <<EOF
      { "auths": { "$REGISTRY_HOST": { "auth": "$AUTH" } } }
      EOF
    - |
      IMAGE="$REGISTRY_PROJECT/$REPOSITORY"
      if [ -n "$CI_COMMIT_TAG" ]; then
        # v0.10.0 -> 0.10.0, matching the image tags in operator/ and VERSION
        DEST="--destination $IMAGE:${CI_COMMIT_TAG#v} --destination $IMAGE:latest"
      else
        DEST="--destination $IMAGE:$CI_COMMIT_SHORT_SHA --destination $IMAGE:$CI_COMMIT_REF_SLUG"
      fi
      echo "Pushing: $DEST"
      # Harbor uses an internal CA the runners don't trust, so skip TLS
      # verification for the Harbor host only.
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/$DOCKERFILE" \
        --skip-tls-verify-registry="$REGISTRY_HOST" \
        --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" \
        --label "org.opencontainers.image.source=$CI_PROJECT_URL" \
        $DEST

# MinIO -> Buckets -> MinIO on the shared cluster (tests/e2e-k8s/adopt-minio.sh),
# without and with KES, each in a namespace of its own that it deletes. Runs
# on release tags (v*) and by hand on main.
adopt-roundtrip:
  stage: e2e
  image: alpine:3.22
  needs: [build]
  timeout: 75m
  interruptible: false
  parallel:
    matrix:
      - VARIANT: [plain, kes]
  resource_group: adopt-roundtrip-$VARIANT
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: true
  variables:
    NS: buckets-ci-$CI_PIPELINE_ID-$VARIANT
  before_script:
    - apk add --no-cache -q bash curl openssl python3 py3-yaml xxd coreutils kubectl helm
    - |
      if [ -n "$KUBE_CONTEXT" ]; then
        kubectl config use-context "$KUBE_CONTEXT"
      elif [ -z "$KUBECONFIG" ]; then
        echo "ERROR: no cluster access: set KUBE_CONTEXT (a GitLab agent's context) or a KUBECONFIG File variable."
        exit 1
      fi
    - |
      kubectl auth can-i create namespaces >/dev/null || { echo "ERROR: this account may not create namespaces"; exit 1; }
  script:
    # the images build pushed: <tag without v> for a release tag, else the short SHA
    - export BUCKETS_TAG=${CI_COMMIT_TAG:+${CI_COMMIT_TAG#v}}
    - export BUCKETS_TAG=${BUCKETS_TAG:-$CI_COMMIT_SHORT_SHA}
    - export AVOID_NODES="$E2E_AVOID_NODES"
    - if [ "$VARIANT" = kes ]; then export KES=1; fi
    - bash tests/e2e-k8s/adopt-minio.sh
  after_script:
    # a cancelled or timed-out run leaves its namespace: the PVs back to Delete, then everything goes
    - apk add --no-cache -q kubectl helm >/dev/null 2>&1 || true
    - if [ -n "$KUBE_CONTEXT" ]; then kubectl config use-context "$KUBE_CONTEXT" >/dev/null; fi
    - |
      if kubectl get namespace "$NS" >/dev/null 2>&1; then
        for pv in $(kubectl -n "$NS" get pvc -o jsonpath='{range .items[*]}{.spec.volumeName}{" "}{end}'); do
          kubectl patch pv "$pv" -p '{"spec":{"persistentVolumeReclaimPolicy":"Delete"}}' >/dev/null || true
        done
        helm -n "$NS" uninstall adopt-operator >/dev/null 2>&1 || true
        kubectl delete namespace "$NS" --wait=false || true
      fi
