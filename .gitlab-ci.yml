# GitLab CI/CD for Buckets: build the three images and push them to Harbor.
#
#   harbor.os.harlandclarke.internal/vericast/bucketsd          (docker/Dockerfile.bucketsd)
#   harbor.os.harlandclarke.internal/vericast/buckets-operator  (docker/Dockerfile.operator)
#   harbor.os.harlandclarke.internal/vericast/buckets-console   (docker/Dockerfile.console)
#
# Tags pushed:
#   - branches main and the default branch: <short-sha> and <branch-slug>
#   - git tags:                              <tag without a leading v> and latest
#
# Required CI/CD variables (Settings > CI/CD > Variables), masked + protected:
#   HARBOR_USERNAME  Harbor robot account, e.g. robot$vericast+gitlab
#   HARBOR_PASSWORD  the robot account token
#
# The robot needs push on the "vericast" Harbor project. If the variables are
# protected, main must be a protected branch or they arrive empty.

stages:
  - build

variables:
  REGISTRY_HOST: harbor.os.harlandclarke.internal
  REGISTRY_PROJECT: $REGISTRY_HOST/vericast

default:
  tags:
    - sa1x-k8s-dev-1a

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# One job per image, built in parallel with Kaniko (no Docker daemon).
build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  timeout: 1h
  interruptible: true
  parallel:
    matrix:
      - REPOSITORY: bucketsd
        DOCKERFILE: docker/Dockerfile.bucketsd
      - REPOSITORY: buckets-operator
        DOCKERFILE: docker/Dockerfile.operator
      - REPOSITORY: buckets-console
        DOCKERFILE: docker/Dockerfile.console
      - REPOSITORY: buckets-kes
        DOCKERFILE: docker/Dockerfile.kes
  script:
    - |
      if [ -z "$HARBOR_USER" ] || [ -z "$HARBOR_PASSWORD" ]; then
        echo "ERROR: HARBOR_USER / HARBOR_PASSWORD are empty."
        echo "Set them in Settings > CI/CD > Variables. If they are 'Protected',"
        echo "either protect this branch/tag or untick Protected."
        exit 1
      fi
    - |
      AUTH=$(printf '%s:%s' "$HARBOR_USER" "$HARBOR_PASSWORD" | base64 | tr -d '\n')
      mkdir -p /kaniko/.docker
      cat > /kaniko/.docker/config.json <<EOF
      { "auths": { "$REGISTRY_HOST": { "auth": "$AUTH" } } }
      EOF
    - |
      IMAGE="$REGISTRY_PROJECT/$REPOSITORY"
      if [ -n "$CI_COMMIT_TAG" ]; then
        # v0.10.0 -> 0.10.0, matching the image tags in operator/ and VERSION
        DEST="--destination $IMAGE:${CI_COMMIT_TAG#v} --destination $IMAGE:latest"
      else
        DEST="--destination $IMAGE:$CI_COMMIT_SHORT_SHA --destination $IMAGE:$CI_COMMIT_REF_SLUG"
      fi
      echo "Pushing: $DEST"
      # Harbor uses an internal CA the runners don't trust, so skip TLS
      # verification for the Harbor host only.
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/$DOCKERFILE" \
        --skip-tls-verify-registry="$REGISTRY_HOST" \
        --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" \
        --label "org.opencontainers.image.source=$CI_PROJECT_URL" \
        $DEST
