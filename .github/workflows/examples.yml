# The integration examples end to end, each against Buckets built from this
# commit, with the checks in examples/<example>/tools/test.py:
#   - lakehouse:  Nessie, Trino, Apache Ranger, Keycloak (docs/integrations/lakehouse.md)
#   - hive-spark: Hive Metastore, Spark, Trino, Apache Ranger, Keycloak
#                 (docs/integrations/hive-spark.md)
#   - jupyterhub: JupyterHub, Keycloak (docs/integrations/jupyterhub.md)
name: examples

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'examples/**'
      - 'src/**'
      - 'docker/Dockerfile.bucketsd'
      - 'CMakeLists.txt'
      - '.github/workflows/examples.yml'
  pull_request:
    paths:
      - 'examples/**'
      - 'src/**'
      - 'docker/Dockerfile.bucketsd'
      - 'CMakeLists.txt'
      - '.github/workflows/examples.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: examples-${{ github.ref }}
  cancel-in-progress: true

jobs:
  example:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        example: [lakehouse, hive-spark, jupyterhub]
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}
    env:
      BUCKETS_IMAGE: buckets-ci/bucketsd:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Build bucketsd
        working-directory: .
        run: docker build -f docker/Dockerfile.bucketsd -t "$BUCKETS_IMAGE" .

      - name: Start the stack
        run: docker compose up -d --wait --wait-timeout 900

      - name: Run the checks
        run: docker compose run --rm test

      - name: Logs
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 200

      - name: Stop
        if: always()
        run: docker compose down -v
