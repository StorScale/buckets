# Buckets' images, built from docker/Dockerfile.* and pushed to ghcr.io/storscale:
#
#   ghcr.io/storscale/bucketsd
#   ghcr.io/storscale/buckets-operator
#   ghcr.io/storscale/buckets-console
#   ghcr.io/storscale/buckets-kes
#
# Tags pushed:
#   - pushes to main:   <short sha (8)> and main
#   - tags v<version>:  <version> and latest; the images are also signed with
#                       cosign (keyless: this workflow's GitHub identity), and the
#                       operator's Helm chart goes to oci://ghcr.io/storscale/charts
# Every image carries an SBOM and build provenance as attestations.
#
# Verify a release image:
#   cosign verify ghcr.io/storscale/bucketsd:<version> \
#     --certificate-identity-regexp '^https://github.com/StorScale/buckets/\.github/workflows/images\.yml@refs/tags/v' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
name: images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  REGISTRY: ghcr.io/storscale

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write   # push to ghcr.io
      id-token: write   # cosign keyless signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: bucketsd
            dockerfile: docker/Dockerfile.bucketsd
          - name: buckets-operator
            dockerfile: docker/Dockerfile.operator
          - name: buckets-console
            dockerfile: docker/Dockerfile.console
          - name: buckets-kes
            dockerfile: docker/Dockerfile.kes
    steps:
      - uses: actions/checkout@v4

      - name: Tags
        id: tags
        run: |
          image="$REGISTRY/${{ matrix.name }}"
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            version=${GITHUB_REF_NAME#v}
            echo "list=$image:$version,$image:latest" >> "$GITHUB_OUTPUT"
          else
            echo "list=$image:${GITHUB_SHA::8},$image:${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      - uses: sigstore/cosign-installer@v3
        if: startsWith(github.ref, 'refs/tags/v')

      - name: Sign
        if: startsWith(github.ref, 'refs/tags/v')
        run: cosign sign --yes "${{ steps.tags.outputs.image }}@${{ steps.build.outputs.digest }}"

  chart:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: sigstore/cosign-installer@v3
      - name: Package and push the operator's chart
        run: |
          version=${GITHUB_REF_NAME#v}
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package operator/helm/buckets-operator --version "$version" --app-version "$version"
          helm push "buckets-operator-$version.tgz" oci://ghcr.io/storscale/charts 2>&1 | tee push.log
          digest=$(grep -o 'sha256:[0-9a-f]*' push.log | head -1)
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          cosign sign --yes "ghcr.io/storscale/charts/buckets-operator@$digest"
