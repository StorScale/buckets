# Buckets' images, built from docker/Dockerfile.* and pushed to ghcr.io/storscale:
#
#   ghcr.io/storscale/bucketsd
#   ghcr.io/storscale/buckets-operator
#   ghcr.io/storscale/buckets-console
#   ghcr.io/storscale/buckets-kes
#
# Tags pushed:
#   - pushes to main:   <short sha (8)> and main
#   - pushes to perf/* and feature/*: <short sha (8)> and the branch name (slashes
#                       as dashes), to try a change on a cluster before it reaches main
#   - tags v<version>:  <version> and latest; the images are also signed with
#                       cosign (keyless: this workflow's GitHub identity), and the
#                       operator's Helm chart goes to oci://ghcr.io/storscale/charts
# Every image is multi-arch (linux/amd64 and linux/arm64, each built natively)
# and carries an SBOM and build provenance as attestations. Each also comes as
# a -fips build (the Dockerfiles' fips target, every tag with -fips appended:
# <version>-fips, latest-fips, ...), which always runs in FIPS 140-3 mode with
# OpenSSL's FIPS provider (docs/fips.md).
#
# Verify a release image:
#   cosign verify ghcr.io/storscale/bucketsd:<version> \
#     --certificate-identity-regexp '^https://github.com/StorScale/buckets/\.github/workflows/images\.yml@refs/tags/v' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
name: images

on:
  push:
    branches: [main, 'perf/**', 'feature/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  REGISTRY: ghcr.io/storscale

jobs:
  # Each image is built natively on an amd64 and an arm64 runner and pushed by
  # digest; "merge" then joins the two under the tags as one multi-arch image.
  image:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write   # push to ghcr.io
    strategy:
      fail-fast: false
      matrix:
        name: [bucketsd, buckets-operator, buckets-console, buckets-kes]
        arch: [amd64, arm64]
        variant: [standard, fips]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          - name: bucketsd
            dockerfile: docker/Dockerfile.bucketsd
          - name: buckets-operator
            dockerfile: docker/Dockerfile.operator
          - name: buckets-console
            dockerfile: docker/Dockerfile.console
          - name: buckets-kes
            dockerfile: docker/Dockerfile.kes
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.variant == 'fips' && 'fips' || '' }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ matrix.name }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.name }}-${{ matrix.arch }}-${{ matrix.variant }}
          cache-to: type=gha,scope=${{ matrix.name }}-${{ matrix.arch }}-${{ matrix.variant }},mode=max

      - name: Record the digest
        run: |
          mkdir -p digests
          echo "${{ steps.build.outputs.digest }}" > "digests/${{ matrix.arch }}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.name }}-${{ matrix.variant }}-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

  merge:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write   # push to ghcr.io
      id-token: write   # cosign keyless signing
    strategy:
      fail-fast: false
      matrix:
        name: [bucketsd, buckets-operator, buckets-console, buckets-kes]
        variant: [standard, fips]
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-${{ matrix.name }}-${{ matrix.variant }}-*
          merge-multiple: true
          path: digests

      - name: Tags
        id: tags
        run: |
          image="$REGISTRY/${{ matrix.name }}"
          sfx=${{ matrix.variant == 'fips' && '-fips' || '' }}
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            version=${GITHUB_REF_NAME#v}
            echo "list=$image:$version$sfx $image:latest$sfx" >> "$GITHUB_OUTPUT"
          else
            echo "list=$image:${GITHUB_SHA::8}$sfx $image:${GITHUB_REF_NAME//\//-}$sfx" >> "$GITHUB_OUTPUT"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Join the architectures under the tags
        id: merge
        run: |
          image=${{ steps.tags.outputs.image }}
          tags=(); for t in ${{ steps.tags.outputs.list }}; do tags+=(-t "$t"); done
          docker buildx imagetools create "${tags[@]}" "$image@$(cat digests/amd64)" "$image@$(cat digests/arm64)"
          first="${{ steps.tags.outputs.list }}"; first=${first%% *}
          docker buildx imagetools inspect "$first"
          echo "digest=$(docker buildx imagetools inspect "$first" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@v3
        if: startsWith(github.ref, 'refs/tags/v')

      - name: Sign
        if: startsWith(github.ref, 'refs/tags/v')
        run: cosign sign --yes "${{ steps.tags.outputs.image }}@${{ steps.merge.outputs.digest }}"

  chart:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: merge
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - uses: sigstore/cosign-installer@v3
      - name: Package and push the operator's chart
        run: |
          version=${GITHUB_REF_NAME#v}
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package operator/helm/buckets-operator --version "$version" --app-version "$version"
          helm push "buckets-operator-$version.tgz" oci://ghcr.io/storscale/charts 2>&1 | tee push.log
          digest=$(grep -o 'sha256:[0-9a-f]*' push.log | head -1)
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          cosign sign --yes "ghcr.io/storscale/charts/buckets-operator@$digest"
