apiVersion: buckets.io/v1alpha1
kind: BucketsPolicy
metadata:
  name: reports-rw
spec:
  cluster: store
  policy:
    Version: "2012-10-17"
    Statement:
      - Effect: Allow
        Action: ["s3:ListBucket", "s3:GetBucketLocation"]
        Resource: ["arn:aws:s3:::reports", "arn:aws:s3:::raw"]
      - Effect: Allow
        Action: ["s3:GetObject", "s3:PutObject", "s3:DeleteObject"]
        Resource: ["arn:aws:s3:::reports/*", "arn:aws:s3:::raw/*"]
