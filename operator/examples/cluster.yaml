# A 4-server cluster with 4 drives each: one 16-drive erasure set (EC 12+4 by
# default), surviving the loss of any server.
apiVersion: buckets.io/v1alpha1
kind: BucketsCluster
metadata:
  name: store
spec:
  image: ghcr.io/storscale/bucketsd:1.2.0
  pools:
    - servers: 4
      volumesPerServer: 4
      volumeClaimTemplate:
        storageClassName: standard
        resources:
          requests:
            storage: 100Gi
      resources:
        requests: {cpu: "1", memory: 2Gi}
  # The web console, a Deployment of its own (not on the storage pods).
  console:
    enabled: true
    replicas: 2
    # s3URL: https://s3.example.com   # S3 as browsers reach it; enables share links
    # ingress:
    #   host: console.example.com
    #   ingressClassName: nginx
    #   tlsSecret: {name: console-tls}
