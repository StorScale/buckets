# Buckets alert rules (docs/monitoring.md). The Helm chart installs them as a
# PrometheusRule; without the Prometheus Operator, load this file as a
# Prometheus rule file. Every series carries buckets_cluster (the cluster's
# name) and scope ("cluster": /minio/v2/metrics/cluster, scraped once through
# the cluster's Service; "node": /minio/v2/metrics/node, scraped on every
# server), which the operator's ServiceMonitor (or the scrape configuration in
# docs/monitoring.md) adds.
groups:
  - name: buckets
    rules:
      - alert: BucketsDriveOffline
        expr: max by (namespace, buckets_cluster) (minio_cluster_drive_offline_total{scope="cluster"}) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.buckets_cluster }}: {{ $value }} drive(s) offline"
          description: "Data stays available while each erasure set keeps its quorum, but redundancy is reduced until the drive is back or replaced."
          runbook_url: https://github.com/StorScale/buckets/blob/main/docs/monitoring.md#bucketsdriveoffline

      - alert: BucketsNodeOffline
        expr: max by (namespace, buckets_cluster) (minio_cluster_nodes_offline_total{scope="cluster"}) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.buckets_cluster }}: {{ $value }} server(s) offline"
          description: "Every drive on those servers is unavailable to the cluster."
          runbook_url: https://github.com/StorScale/buckets/blob/main/docs/monitoring.md#bucketsnodeoffline

      - alert: BucketsErasureSetDegraded
        expr: |
          min by (namespace, buckets_cluster, pool, set) (minio_cluster_health_erasure_set_online_drives{scope="cluster"})
            <= max by (namespace, buckets_cluster, pool, set) (minio_cluster_health_erasure_set_write_quorum{scope="cluster"})
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.buckets_cluster }}: pool {{ $labels.pool }}, set {{ $labels.set }} is at its write quorum"
          description: "One more drive failure in this erasure set stops writes to it."
          runbook_url: https://github.com/StorScale/buckets/blob/main/docs/monitoring.md#bucketserasuresetdegraded

      - alert: BucketsDriveErrors
        expr: |
          sum by (namespace, buckets_cluster, server, drive) (
            increase(minio_node_drive_errors_ioerror{scope="node"}[15m])
            + increase(minio_node_drive_errors_timeout{scope="node"}[15m])
          ) > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.buckets_cluster }}: drive {{ $labels.drive }} on {{ $labels.server }} is returning I/O errors or timeouts"
          description: "{{ $value }} errors in the last 15 minutes. A drive that keeps erroring is often about to fail."
          runbook_url: https://github.com/StorScale/buckets/blob/main/docs/monitoring.md#bucketsdriveerrors

      - alert: BucketsHealingSlow
        expr: max by (namespace, buckets_cluster, pool, set) (minio_cluster_health_erasure_set_healing_drives{scope="cluster"}) > 0
        for: 6h
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.buckets_cluster }}: pool {{ $labels.pool }}, set {{ $labels.set }} has been healing for over 6 hours"
          description: "Large drives take a long time to heal; check that healing is still making progress."
          runbook_url: https://github.com/StorScale/buckets/blob/main/docs/monitoring.md#bucketshealingslow

      - alert: BucketsCapacityLow
        expr: |
          min by (namespace, buckets_cluster) (minio_cluster_capacity_usable_free_bytes{scope="cluster"})
            / max by (namespace, buckets_cluster) (minio_cluster_capacity_usable_total_bytes{scope="cluster"}) < 0.15
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.buckets_cluster }}: {{ $value | humanizePercentage }} of usable capacity left"
          runbook_url: https://github.com/StorScale/buckets/blob/main/docs/monitoring.md#bucketscapacitylow

      - alert: BucketsCapacityCritical
        expr: |
          min by (namespace, buckets_cluster) (minio_cluster_capacity_usable_free_bytes{scope="cluster"})
            / max by (namespace, buckets_cluster) (minio_cluster_capacity_usable_total_bytes{scope="cluster"}) < 0.05
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.buckets_cluster }}: only {{ $value | humanizePercentage }} of usable capacity left"
          description: "Writes fail once the drives are full."
          runbook_url: https://github.com/StorScale/buckets/blob/main/docs/monitoring.md#bucketscapacitylow

      - alert: BucketsCapacityFullIn7Days
        expr: |
          # the most free space each half hour: a server restarting takes its drives out of the others' count
          # for a few minutes, and those dips are not a trend
          predict_linear(min by (namespace, buckets_cluster) (max_over_time(minio_cluster_capacity_usable_free_bytes{scope="cluster"}[30m]))[6h:10m], 7 * 86400) < 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.buckets_cluster }}: at the rate of the last 6 hours, usable capacity runs out within 7 days"
          runbook_url: https://github.com/StorScale/buckets/blob/main/docs/monitoring.md#bucketscapacitylow

      - alert: BucketsHighErrorRate
        expr: |
          sum by (namespace, buckets_cluster) (rate(minio_s3_requests_5xx_errors_total{scope="node"}[5m]))
            / sum by (namespace, buckets_cluster) (rate(minio_s3_requests_total{scope="node"}[5m])) > 0.05
          and sum by (namespace, buckets_cluster) (rate(minio_s3_requests_total{scope="node"}[5m])) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.buckets_cluster }}: {{ $value | humanizePercentage }} of S3 requests are failing with server errors"
          runbook_url: https://github.com/StorScale/buckets/blob/main/docs/monitoring.md#bucketshigherrorrate

      - alert: BucketsAuthFailuresSpike
        expr: |
          sum by (namespace, buckets_cluster) (
            rate(minio_s3_requests_rejected_auth_total{scope="node"}[10m])
            or rate(buckets_console_logins_failed_total[10m])
          ) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.buckets_cluster }}: {{ $value | humanize }} failed sign-ins per second"
          description: "S3 requests with bad credentials and failed console sign-ins together: a misconfigured client, or someone guessing passwords."
          runbook_url: https://github.com/StorScale/buckets/blob/main/docs/monitoring.md#bucketsauthfailuresspike

      - alert: BucketsKMSFailing
        expr: sum by (namespace, buckets_cluster) (increase(minio_cluster_kms_request_failure{scope="cluster"}[10m])) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.buckets_cluster }}: requests to the KMS are failing"
          description: "Encrypted objects cannot be read or written while the KMS is unreachable."
          runbook_url: https://github.com/StorScale/buckets/blob/main/docs/monitoring.md#bucketskmsfailing

      - alert: BucketsKMSOffline
        expr: max by (namespace, buckets_cluster) (minio_cluster_kms_online{scope="cluster"}) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.buckets_cluster }}: the KMS does not answer"
          description: "No KES endpoint answers its status check. Encrypted objects cannot be read or written meanwhile."
          runbook_url: https://github.com/StorScale/buckets/blob/main/docs/monitoring.md#bucketskmsfailing

      - alert: BucketsIdentitySyncFailing
        expr: sum by (namespace, buckets_cluster) (increase(buckets_node_identity_sync_failures_total{scope="node"}[3h])) >= 2
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.buckets_cluster }}: the identity sync cannot reach the provider"
          description: "Twice in three hours the sync could not learn whether people with credentials are still in the identity provider. People who left keep their access keys until it works again."
          runbook_url: https://github.com/StorScale/buckets/blob/main/docs/monitoring.md#bucketsidentitysyncfailing

      - alert: BucketsIdentitySyncHeld
        expr: sum by (namespace, buckets_cluster) (increase(buckets_node_identity_sync_held_total{scope="node"}[2h])) > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.buckets_cluster }}: the identity sync held back removals"
          description: "More people left the identity provider at once than BUCKETS_OPENID_REMOVE_MAX allows, so none were removed. Check the provider; if it is right, raise the limit."
          runbook_url: https://github.com/StorScale/buckets/blob/main/docs/monitoring.md#bucketsidentitysyncheld

      - alert: BucketsMassDelete
        expr: sum by (namespace, buckets_cluster) (increase(buckets_ransomware_incidents_total{scope="node",kind="mass-delete"}[10m])) > 0
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.buckets_cluster }}: objects are being deleted far faster than usual"
          description: "A bucket, or a credential across buckets, deleted at least BUCKETS_RANSOMWARE_FLOOR objects in a few minutes, many times its usual rate: ransomware, a stolen credential, or a mistaken job. Reports → Activity names the bucket and the credential."
          runbook_url: https://github.com/StorScale/buckets/blob/main/docs/monitoring.md#bucketsmassdelete

      - alert: BucketsMassOverwrite
        expr: sum by (namespace, buckets_cluster) (increase(buckets_ransomware_incidents_total{scope="node",kind="mass-overwrite"}[10m])) > 0
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.buckets_cluster }}: objects are being overwritten far faster than usual"
          description: "Existing objects are being replaced at many times the usual rate, as ransomware does when it encrypts data in place. Reports → Activity names the bucket and the credential."
          runbook_url: https://github.com/StorScale/buckets/blob/main/docs/monitoring.md#bucketsmassoverwrite

      - alert: BucketsProtectionRemoved
        expr: sum by (namespace, buckets_cluster) (increase(buckets_ransomware_incidents_total{scope="node",kind="protection-removed"}[10m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.buckets_cluster }}: a bucket's protection was weakened"
          description: "Versioning suspended, a rule that expires old versions added, retention bypassed, a bucket deleted with its data, or a policy letting anyone write or delete. Often an admin's change; also what an attacker does first. Reports → Activity says which."
          runbook_url: https://github.com/StorScale/buckets/blob/main/docs/monitoring.md#bucketsprotectionremoved

      - alert: BucketsMetricsDown
        expr: max by (namespace, buckets_cluster, pod) (up{buckets_cluster!=""} == 0)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.buckets_cluster }}: Prometheus cannot scrape {{ $labels.pod }}"
          description: "The server may be down, or the metrics token may be wrong; none of the other alerts can fire for it meanwhile."
          runbook_url: https://github.com/StorScale/buckets/blob/main/docs/monitoring.md#bucketsmetricsdown
