# Two replicas: one leader (a Lease in the release namespace), one standby.
replicaCount: 2

image:
  repository: ghcr.io/storscale/buckets-operator
  tag: "" # defaults to the chart's appVersion
  pullPolicy: IfNotPresent
# FIPS 140-3 mode for the operator itself (docs/fips.md): its -fips image, with the operator's TLS in the OpenSSL
# FIPS provider. Clusters choose for themselves, with spec.fips.
fips: false
imagePullSecrets: []

# Watch BucketsClusters in one namespace only (RBAC then becomes a Role
# there instead of a ClusterRole). Empty: all namespaces.
watchNamespace: ""

logLevel: info # debug|info|warn|error

# The KES image clusters run for spec.kms.kes when they name none (default:
# ghcr.io/storscale/buckets-kes at the chart's version). Point it at a
# registry mirror, or at MinIO's KES, which reads the same configuration.
kesImage: ""

serviceAccount:
  create: true
  name: "" # defaults to the release's full name
  annotations: {}

rbac:
  create: true

resources:
  requests: {cpu: 50m, memory: 32Mi}
  limits: {memory: 128Mi}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  seccompProfile: {type: RuntimeDefault}
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: [ALL]}

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""
extraEnv: []

# Monitoring (docs/monitoring.md). Each BucketsCluster gets a ServiceMonitor
# from the operator (spec.monitoring); the alert rules and dashboards are the
# same for every cluster, so the chart installs them once.
monitoring:
  rules:
    # A PrometheusRule with the alerts (monitoring/rules.yaml), when the
    # Prometheus Operator's CRDs are installed.
    enabled: true
    labels: {} # for a Prometheus that selects rules by label
  dashboards:
    # ConfigMaps for Grafana's dashboard sidecar (kube-prometheus-stack,
    # Rancher monitoring). On Rancher, set namespace to cattle-dashboards.
    enabled: true
    namespace: "" # default: the release's namespace
    labels: {grafana_dashboard: "1"}
    folder: Buckets
