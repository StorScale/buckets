# buckets-operator: namespace, RBAC and Deployment. Install the CRDs first:
#   kubectl apply -f operator/deploy/crds/
#   kubectl apply -f operator/deploy/operator.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: buckets-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: buckets-operator
  namespace: buckets-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: buckets-operator
rules:
  - apiGroups: [buckets.io]
    resources: [buckets, bucketssitereplications]
    verbs: [get, list, watch]
  - apiGroups: [buckets.io] # patch: granted to each cluster's console, for its KMS settings
    resources: [bucketsclusters]
    verbs: [get, list, watch, patch]
  - apiGroups: [buckets.io] # patch: the cleanup finalizer
    resources: [bucketsusers, bucketspolicies]
    verbs: [get, list, watch, patch]
  - apiGroups: [buckets.io]
    resources: [bucketsclusters/status, bucketsusers/status, bucketspolicies/status, buckets/status, bucketssitereplications/status]
    verbs: [get, patch, update]
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [get, list, watch, create, patch, update]
  - apiGroups: [apps] # the console
    resources: [deployments]
    verbs: [get, list, watch, create, patch, update, delete]
  - apiGroups: [networking.k8s.io] # the console's Ingress
    resources: [ingresses]
    verbs: [get, list, watch, create, patch, update, delete]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, watch, create, patch, update, delete]
  - apiGroups: [""] # update: granted to each cluster's console, for its KMS settings
    resources: [secrets]
    verbs: [get, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, delete]
  - apiGroups: [""] # why a KES server failed
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""] # KES's and the console's accounts
    resources: [serviceaccounts]
    verbs: [get, create, patch, update, delete]
  - apiGroups: [rbac.authorization.k8s.io] # the console's Role over its own cluster
    resources: [roles, rolebindings]
    verbs: [get, create, patch, update, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, patch, update]
  - apiGroups: [monitoring.coreos.com] # each cluster's ServiceMonitor
    resources: [servicemonitors]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [cert-manager.io] # spec.tls.certManager: the cluster's certificates and its own CA
    resources: [certificates, issuers]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: buckets-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: buckets-operator
subjects:
  - kind: ServiceAccount
    name: buckets-operator
    namespace: buckets-system
---
# Leader election lease, in the operator's own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: buckets-operator-leader
  namespace: buckets-system
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: buckets-operator-leader
  namespace: buckets-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: buckets-operator-leader
subjects:
  - kind: ServiceAccount
    name: buckets-operator
    namespace: buckets-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buckets-operator
  namespace: buckets-system
  labels: {app.kubernetes.io/name: buckets-operator}
spec:
  replicas: 2 # one leader, one standby
  selector:
    matchLabels: {app.kubernetes.io/name: buckets-operator}
  template:
    metadata:
      labels: {app.kubernetes.io/name: buckets-operator}
    spec:
      serviceAccountName: buckets-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: operator
          image: ghcr.io/storscale/buckets-operator:1.10.0
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            # - name: BUCKETS_OPERATOR_NAMESPACE   # watch a single namespace
            #   value: my-namespace
            # - name: BUCKETS_KES_IMAGE            # the KES image clusters run by default
            #   value: registry.example.com/buckets/buckets-kes:1.10.0
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp} # CA files for TLS clusters and KES
      volumes:
        - {name: tmp, emptyDir: {}}
