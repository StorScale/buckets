# Declarative IAM and buckets, applied through a BucketsCluster's admin API.
# The operator reconciles these once the admin API lands (Phase 4); until then
# it records that in each object's status.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: bucketsusers.buckets.io
spec:
  group: buckets.io
  scope: Namespaced
  names: {kind: BucketsUser, listKind: BucketsUserList, plural: bucketsusers, singular: bucketsuser}
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [cluster, credsSecret]
              properties:
                cluster: {type: string, description: BucketsCluster in this namespace}
                credsSecret:
                  type: object
                  description: Secret with keys accessKey and secretKey.
                  properties: {name: {type: string}}
                policies: {type: array, items: {type: string}}
                groups: {type: array, items: {type: string}}
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: bucketspolicies.buckets.io
spec:
  group: buckets.io
  scope: Namespaced
  names: {kind: BucketsPolicy, listKind: BucketsPolicyList, plural: bucketspolicies, singular: bucketspolicy}
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [cluster, policy]
              properties:
                cluster: {type: string}
                policy:
                  type: object
                  description: An IAM policy document (Version, Statement).
                  x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
---
# Bucket is the one singular kind: each object is a single S3 bucket.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: buckets.buckets.io
spec:
  group: buckets.io
  scope: Namespaced
  names: {kind: Bucket, listKind: BucketList, plural: buckets, singular: bucket}
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [cluster]
              properties:
                cluster: {type: string}
                name: {type: string, description: S3 bucket name (defaults to metadata.name)}
                versioning: {type: boolean}
                objectLock: {type: boolean}
                quota: {type: string, description: e.g. 100Gi}
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
