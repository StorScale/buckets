# BucketsSiteReplication: site replication between BucketsClusters and other
# sites. Sites added to the list are added, sites taken out are removed, and a
# list of one site stops the replication through it. Deleting the resource
# leaves the replication in place.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: bucketssitereplications.buckets.io
spec:
  group: buckets.io
  scope: Namespaced
  names:
    kind: BucketsSiteReplication
    listKind: BucketsSiteReplicationList
    plural: bucketssitereplications
    singular: bucketssitereplication
    shortNames: [bsr]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [sites]
              properties:
                sites:
                  type: array
                  minItems: 1
                  description: >-
                    The sites, the first one first: the operator sets the replication up through it.
                    The one site with buckets goes first when the others are empty.
                  items:
                    type: object
                    properties:
                      cluster: {type: string, description: A BucketsCluster in this namespace}
                      name: {type: string, description: "The site's name (default: the cluster's name; needed with endpoint)"}
                      endpoint: {type: string, description: Another site's S3 URL, reachable from every site}
                      credsSecret:
                        type: object
                        description: That site's root credentials (accessKey, secretKey)
                        properties:
                          name: {type: string}
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - {name: Phase, type: string, jsonPath: .status.phase}
        - {name: Sites, type: string, jsonPath: .status.sites}
        - {name: Checked, type: date, jsonPath: .status.checkedAt}
