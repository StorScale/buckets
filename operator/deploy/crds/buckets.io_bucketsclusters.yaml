# BucketsCluster: one Buckets deployment -- server pools of StatefulSets, the
# S3 Service, root credentials, TLS. Reconciled by buckets-operator.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: bucketsclusters.buckets.io
spec:
  group: buckets.io
  scope: Namespaced
  names:
    kind: BucketsCluster
    listKind: BucketsClusterList
    plural: bucketsclusters
    singular: bucketscluster
    shortNames: [bc]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Servers
          type: string
          jsonPath: .status.readyServersText
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [pools]
              properties:
                image:
                  type: string
                  description: bucketsd container image.
                  default: ghcr.io/storscale/bucketsd:1.8.0
                imagePullPolicy:
                  type: string
                  enum: [Always, IfNotPresent, Never]
                  default: IfNotPresent
                imagePullSecrets:
                  type: array
                  items:
                    type: object
                    properties:
                      name: {type: string}
                credsSecret:
                  type: object
                  description: >-
                    Secret with keys rootUser and rootPassword. When omitted, the
                    operator creates <name>-root with generated credentials.
                  properties:
                    name: {type: string}
                pools:
                  type: array
                  minItems: 1
                  description: >-
                    Server pools. Pools may be appended to expand the cluster; the
                    whole cluster restarts together when its topology changes.
                  items:
                    type: object
                    required: [servers, volumesPerServer]
                    properties:
                      name:
                        type: string
                        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                        maxLength: 20
                      servers:
                        type: integer
                        minimum: 1
                      volumesPerServer:
                        type: integer
                        minimum: 1
                      volumeClaimTemplate:
                        type: object
                        description: PersistentVolumeClaim spec for each drive.
                        x-kubernetes-preserve-unknown-fields: true
                      resources:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                      nodeSelector:
                        type: object
                        additionalProperties: {type: string}
                      tolerations:
                        type: array
                        items:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                      affinity:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                parity:
                  type: integer
                  minimum: 0
                  description: Parity drives per erasure set (EC:N). Default depends on the set size.
                erasureSetDriveCount:
                  type: integer
                  minimum: 2
                  maximum: 16
                tls:
                  type: object
                  properties:
                    certSecret:
                      type: object
                      description: A kubernetes.io/tls Secret (tls.crt, tls.key) for S3 and internode traffic.
                      properties:
                        name: {type: string}
                    caSecret:
                      type: object
                      description: A Secret whose ca.crt nodes trust (defaults to the certificate's own ca.crt).
                      properties:
                        name: {type: string}
                    certManager:
                      type: object
                      description: "Have cert-manager issue the certificate (Secret <name>-tls). Without issuerRef, the operator makes the cluster a CA of its own. Not with certSecret."
                      properties:
                        issuerRef:
                          type: object
                          required: [name]
                          properties:
                            name: {type: string}
                            kind: {type: string, description: "Issuer (default) or ClusterIssuer"}
                            group: {type: string, description: "default cert-manager.io"}
                        dnsNames:
                          type: array
                          items: {type: string}
                          description: Names besides the ones the operator puts in, for example an external host name.
                        duration:
                          type: string
                          description: "The certificate's lifetime, e.g. 2160h (default: the issuer's)."
                        privateKey:
                          type: object
                          description: "The key's kind (default: ECDSA P-256 from the cluster's own CA, else the issuer's default, RSA 2048). Some issuers sign only RSA (Vault PKI roles, for one)."
                          properties:
                            algorithm: {type: string, enum: [RSA, ECDSA, Ed25519]}
                            size: {type: integer}
                configuration:
                  type: object
                  description: >-
                    A Secret with a config.env of export KEY=value lines, as the MinIO Operator
                    keeps a tenant's; bucketsd reads it (root credentials included). Replaces
                    credsSecret, for adopting a MinIO tenant.
                  properties:
                    name: {type: string}
                drives:
                  type: object
                  description: >-
                    Where drives are mounted: <mountPath><n>, with data in <mountPath><n><subPath>.
                    The MinIO Operator uses /export and /data.
                  properties:
                    mountPath: {type: string, default: /data}
                    subPath: {type: string}
                securityContext:
                  type: object
                  description: The servers' user and groups (65532 by default); a MinIO tenant's files belong to 1000.
                  properties:
                    runAsUser: {type: integer}
                    runAsGroup: {type: integer}
                    fsGroup: {type: integer}
                servicePort:
                  type: integer
                  description: The S3 Service's port (9000 by default; a MinIO tenant's is 443 with TLS, else 80).
                  minimum: 1
                  maximum: 65535
                volumes:
                  type: array
                  description: Extra pod volumes for the servers, such as a KES client certificate.
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                volumeMounts:
                  type: array
                  description: Where the extra volumes are mounted in the bucketsd container.
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                env:
                  type: array
                  description: Extra environment for bucketsd.
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                serviceType:
                  type: string
                  enum: [ClusterIP, NodePort, LoadBalancer]
                  default: ClusterIP
                monitoring:
                  type: object
                  description: "A ServiceMonitor for the Prometheus Operator, with a metrics user and its bearer token (Secret <name>-prometheus). See docs/monitoring.md."
                  properties:
                    enabled:
                      type: boolean
                      description: Unset, on when the Prometheus Operator's CRDs are installed; false, off.
                    interval:
                      type: string
                      description: How often Prometheus scrapes (default 30s).
                    labels:
                      type: object
                      additionalProperties: {type: string}
                      description: Extra ServiceMonitor labels, for a Prometheus that selects them by label.
                kms:
                  type: object
                  description: The cluster's key management service, for SSE-S3 and SSE-KMS.
                  properties:
                    kes:
                      type: object
                      description: >-
                        A KES server the operator runs for the cluster. Where it keeps keys (HashiCorp Vault,
                        AWS Secrets Manager, Azure Key Vault, Google Secret Manager) is in Secret <name>-kms
                        (settings.json), which the console's Encryption page writes after testing it.
                      properties:
                        image: {type: string, description: "Defaults to the operator's BUCKETS_KES_IMAGE, else ghcr.io/storscale/buckets-kes (MinIO's KES works too)."}
                        replicas: {type: integer, minimum: 1, default: 2}
                        keyName: {type: string, default: buckets-default, description: The default key for SSE-S3 and for SSE-KMS without a key ID; created when missing.}
                        createKey: {type: boolean, default: true, description: "Create the default key when the key store lacks it. False (an adopted tenant's keys): a missing key is an error, and the servers do not start."}
                        nodeSelector:
                          type: object
                          additionalProperties: {type: string}
                        tolerations:
                          type: array
                          items: {type: object, x-kubernetes-preserve-unknown-fields: true}
                        affinity:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                        name: {type: string, maxLength: 50, pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$", description: "The base name of the KES Deployment, Service and ServiceAccount, and of their Secrets <name>-tls and <name>-identity. Default: <cluster>-kes. scripts/adopt-minio.sh sets <tenant>-buckets-kes, so the tenant's own KES objects keep theirs."}
                        serviceAccountName: {type: string, description: "An existing ServiceAccount for KES to run as (an adopted tenant's KES account, which a Vault Kubernetes role names). Default: the KES name (<cluster>-kes), made by the operator."}
                        resources:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                console:
                  type: object
                  description: The web console (consoled and the SPA), a Deployment of its own apart from storage.
                  properties:
                    nodeSelector:
                      type: object
                      additionalProperties: {type: string}
                      description: Nodes the console may run on, as for pools.
                    tolerations:
                      type: array
                      items: {type: object, x-kubernetes-preserve-unknown-fields: true}
                    affinity:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    enabled: {type: boolean, default: false}
                    replicas: {type: integer, minimum: 1, default: 1}
                    image: {type: string, description: "Defaults to ghcr.io/storscale/buckets-console at the operator's version."}
                    serviceType:
                      type: string
                      enum: [ClusterIP, NodePort, LoadBalancer]
                      default: ClusterIP
                    s3URL:
                      type: string
                      description: >-
                        The S3 endpoint as browsers reach it (for example the S3 Ingress URL).
                        Share links are signed for it; without it the console offers none.
                    tls:
                      type: object
                      description: HTTPS for the console itself (consoled), for example behind a LoadBalancer on 443.
                      properties:
                        certSecret:
                          type: object
                          description: A kubernetes.io/tls Secret (tls.crt, tls.key) that consoled serves.
                          properties:
                            name: {type: string}
                        certManager:
                          type: object
                          description: "Have cert-manager issue the console's certificate (Secret <name>-console-tls), with its Ingress host. Without issuerRef, from the cluster's own CA. Not with certSecret."
                          properties:
                            issuerRef:
                              type: object
                              required: [name]
                              properties:
                                name: {type: string}
                                kind: {type: string}
                                group: {type: string}
                            dnsNames:
                              type: array
                              items: {type: string}
                            duration: {type: string}
                            privateKey:
                              type: object
                              description: "The key's kind (default: ECDSA P-256 from the cluster's own CA, else the issuer's default, RSA 2048). Some issuers sign only RSA (Vault PKI roles, for one)."
                              properties:
                                algorithm: {type: string, enum: [RSA, ECDSA, Ed25519]}
                                size: {type: integer}
                    resources:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    env:
                      type: array
                      description: >-
                        Extra environment for consoled, after the operator's own, for example its
                        OpenID sign-in (BUCKETS_CONSOLE_OIDC_*). Entries may use valueFrom.
                      items:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                    ingress:
                      type: object
                      description: Expose the console at a host name.
                      required: [host]
                      properties:
                        host: {type: string}
                        ingressClassName: {type: string}
                        tlsSecret:
                          type: object
                          properties:
                            name: {type: string}
                        annotations:
                          type: object
                          additionalProperties: {type: string}
            status:
              type: object
              properties:
                phase: {type: string}
                observedGeneration: {type: integer}
                servers: {type: integer}
                readyServers: {type: integer}
                readyServersText: {type: string}
                topology: {type: string}
                credsSecret: {type: string}
                kms:
                  type: object
                  description: The KES server, and the latest trial of new key store settings (test).
                  x-kubernetes-preserve-unknown-fields: true
                tls:
                  type: object
                  description: "The certificates cert-manager issues for spec.tls.certManager: phase (Ready, Issuing) and each one's readiness and expiry."
                  x-kubernetes-preserve-unknown-fields: true
                monitoring:
                  type: object
                  description: "The ServiceMonitor: phase (Ready, Disabled, NotInstalled, Error) and message."
                  x-kubernetes-preserve-unknown-fields: true
                identity:
                  type: object
                  description: "Sign-in settings from the console (Secret <name>-identity): phase (NotManaged, Ready, Conflict, Error), message, description, and the applied settings' hashes."
                  x-kubernetes-preserve-unknown-fields: true
                pools:
                  type: array
                  items:
                    type: object
                    properties:
                      name: {type: string}
                      statefulSet: {type: string}
                      replicas: {type: integer}
                      readyReplicas: {type: integer}
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type: {type: string}
                      status: {type: string}
                      reason: {type: string}
                      message: {type: string}
                      lastTransitionTime: {type: string, format: date-time}
                      observedGeneration: {type: integer}
