# Prometheus for the monitoring example: the scrape configuration from
# docs/monitoring.md ("Without the Prometheus Operator"), and the Helm chart's
# alert rules. The bearer token is a metrics-only user's (tools/setup.py).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yaml

scrape_configs:
  - job_name: buckets-node
    metrics_path: /minio/v2/metrics/node
    authorization: {credentials_file: /etc/prometheus/token/token}
    static_configs:
      - targets: [buckets:9000]
        labels: {buckets_cluster: store, scope: node, namespace: local}
  - job_name: buckets-cluster
    metrics_path: /minio/v2/metrics/cluster
    authorization: {credentials_file: /etc/prometheus/token/token}
    static_configs:
      - targets: [buckets:9000]
        labels: {buckets_cluster: store, scope: cluster, namespace: local}
  - job_name: buckets-bucket
    metrics_path: /minio/v2/metrics/bucket
    authorization: {credentials_file: /etc/prometheus/token/token}
    static_configs:
      - targets: [buckets:9000]
        labels: {buckets_cluster: store, scope: bucket, namespace: local}
