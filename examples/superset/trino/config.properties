coordinator=true
node-scheduler.include-coordinator=true
discovery.uri=http://localhost:8080
http-server.http.port=8080

# Clients connect over HTTPS (port 8443) and sign in with a Keycloak token.
http-server.https.enabled=true
http-server.https.port=8443
http-server.https.keystore.path=/etc/trino/tls/trino.pem
internal-communication.shared-secret=${ENV:TRINO_SHARED_SECRET}

# People sign in with a Keycloak token (JWT); services such as Superset with
# a password (password-authenticator.properties).
http-server.authentication.type=PASSWORD,JWT
http-server.authentication.jwt.key-file=http://keycloak:8080/realms/lakehouse/protocol/openid-connect/certs
http-server.authentication.jwt.required-issuer=http://keycloak:8080/realms/lakehouse
http-server.authentication.jwt.required-audience=lakehouse
http-server.authentication.jwt.principal-field=preferred_username

query.max-memory=1GB
query.max-memory-per-node=512MB
