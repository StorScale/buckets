# Apache Superset on the lakehouse: people sign in to Superset with Keycloak,
# their Keycloak groups are their Superset roles, and Superset runs every
# query in Trino as the person who asked (impersonation), so Apache Ranger's
# policies, masks and row filters apply to each person in SQL Lab and charts.
#
# This includes the whole lakehouse stack (../lakehouse: Buckets, Nessie,
# Trino, Ranger, Keycloak), with lakehouse-override.yaml's changes.
#
#   docker compose up -d --wait               # build, start, and configure
#   docker compose run --rm test              # the end-to-end checks
#   docker compose down -v                    # stop and delete everything
#
# In a browser: add "127.0.0.1 keycloak superset" to /etc/hosts, then open
# http://superset:8088. See ../../docs/integrations/superset.md. Every password
# is in .env and ../lakehouse/.env, for local use only. Run one example at a time.
name: buckets-superset

include:
  - path: [../lakehouse/compose.yaml, lakehouse-override.yaml]
    env_file: [../lakehouse/.env, .env]

x-superset: &superset
  build: ./images
  image: buckets-superset
  env_file: .env
  environment:
    SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
  volumes:
    - ./superset:/app/pythonpath:ro
    - tls:/tls:ro

x-tools: &tools
  build: ../common/tools
  image: buckets-examples-tools
  env_file: [../lakehouse/.env, .env]
  environment:
    PYTHONPATH: /common
  volumes:
    - ./tools:/work:ro
    - ../lakehouse/tools:/lakehouse:ro
    - ../common/tools:/common:ro
    - tls:/tls

services:
  superset-db:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: superset
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: ${SUPERSET_DB_PASSWORD}
    volumes:
      - superset-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset -d superset"]
      interval: 5s
      retries: 60

  # Ranger: Superset may run queries as people; a little data to query.
  superset-setup:
    <<: *tools
    command: ["python", "-u", "/work/superset_setup.py"]
    depends_on:
      setup: {condition: service_completed_successfully}
      trino: {condition: service_healthy}

  # Superset's metadata database, roles and permissions, and the Trino database.
  superset-init:
    <<: *superset
    command: ["sh", "-c", "superset db upgrade && superset init && python /app/pythonpath/bootstrap.py"]
    depends_on:
      superset-db: {condition: service_healthy}

  superset:
    <<: *superset
    ports: ["8088:8088"]
    depends_on:
      superset-init: {condition: service_completed_successfully}
      superset-setup: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8088/health"]
      interval: 5s
      start_period: 30s
      retries: 60

  # The end-to-end checks: docker compose run --rm test
  test:
    <<: *tools
    command: ["python", "-u", "/work/test.py"]
    profiles: ["test"]

volumes:
  superset-db:
