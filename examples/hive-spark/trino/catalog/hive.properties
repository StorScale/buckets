# Hive tables, as Spark and Hive write them: the catalog is the Hive
# Metastore, the data is in Buckets. Trino reads and writes the files with its
# own Buckets service account, allowed the warehouse bucket and nothing else.
connector.name=hive
hive.metastore.uri=thrift://hive-metastore:9083
# Hive Metastore 4 records plain (non-transactional) tables as EXTERNAL, with
# external.table.purge=true, even when they're created as managed tables.
# Without this, Trino refuses to write to them.
hive.non-managed-table-writes-enabled=true

fs.s3.enabled=true
s3.endpoint=http://buckets:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:TRINO_S3_ACCESS_KEY}
s3.aws-secret-key=${ENV:TRINO_S3_SECRET_KEY}
