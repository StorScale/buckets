# Spark: the Hive Metastore is its catalog, Buckets its storage (S3A).
# Its credentials are the AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY
# environment variables (the spark-svc account).

# Hive tables. Spark's built-in Hive client (2.3) uses Thrift calls that Hive
# Metastore 4 no longer serves, so Spark loads a Hive 4.1 client instead,
# downloaded from Maven Central on first use and kept on the ivy volume
# (/ivy/.ivy2.5.2: the driver's user.home is /ivy, see compose.yaml).
spark.sql.catalogImplementation          hive
spark.hadoop.hive.metastore.uris         thrift://hive-metastore:9083
spark.sql.hive.metastore.version         4.1.0
spark.sql.hive.metastore.jars            maven
spark.sql.warehouse.dir                  s3a://warehouse/hive

spark.hadoop.fs.s3a.endpoint                 http://buckets:9000
spark.hadoop.fs.s3a.endpoint.region          us-east-1
spark.hadoop.fs.s3a.path.style.access        true
spark.hadoop.fs.s3a.connection.ssl.enabled   false
spark.hadoop.fs.s3a.aws.credentials.provider software.amazon.awssdk.auth.credentials.EnvironmentVariableCredentialsProvider

# Iceberg tables: catalog "iceberg", the metastore's Iceberg REST catalog.
spark.sql.extensions                     org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.iceberg                org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.iceberg.type           rest
spark.sql.catalog.iceberg.uri            http://hive-metastore:9001/iceberg
spark.sql.catalog.iceberg.io-impl        org.apache.iceberg.hadoop.HadoopFileIO
# Other engines (Trino) change these tables too: don't cache their metadata,
# or Spark keeps reading the snapshot it saw first.
spark.sql.catalog.iceberg.cache-enabled  false

# Spark writes partitions as rows ask for them (INSERT ... without PARTITION values).
spark.hadoop.hive.exec.dynamic.partition.mode  nonstrict

spark.driver.memory                      1g
spark.connect.grpc.binding.port          15002
