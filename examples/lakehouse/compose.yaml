# A lakehouse on Buckets: Iceberg tables in Buckets, Nessie as the catalog,
# Trino as the query engine, Apache Ranger deciding who may query what, and
# Keycloak as the one identity provider for Trino, Ranger and Buckets.
#
#   docker compose up -d --wait               # start, and configure (setup)
#   docker compose run --rm test              # the end-to-end checks
#   docker compose down -v                    # stop and delete everything
#
# The stack is in stack.yaml (other examples include it too); this file adds
# the lakehouse's checks. See README.md. Every password is in .env, and is for
# local use only.
name: buckets-lakehouse

include:
  - stack.yaml

services:
  # The end-to-end checks: docker compose run --rm test
  test:
    build: ../common/tools
    image: buckets-examples-tools
    env_file: .env
    environment:
      PYTHONPATH: /common
    volumes:
      - ./tools:/work:ro
      - ../common/tools:/common:ro
      - tls:/tls
    command: ["python", "-u", "/work/test.py"]
    profiles: ["test"]
