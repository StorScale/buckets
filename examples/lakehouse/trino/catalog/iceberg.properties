# Iceberg tables: the catalog is Nessie (its Iceberg REST API), the data is in
# Buckets. Trino reads and writes the files with its own Buckets service
# account, which is allowed the warehouse bucket and nothing else.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://nessie:19120/iceberg/
iceberg.rest-catalog.warehouse=warehouse

fs.s3.enabled=true
s3.endpoint=http://buckets:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:TRINO_S3_ACCESS_KEY}
s3.aws-secret-key=${ENV:TRINO_S3_SECRET_KEY}
