# Apache Ranger decides what each user may do: catalogs, schemas, tables,
# columns, column masks and row filters. Policies live in Ranger's service
# "lakehouse" (created by tools/setup.py).
access-control.name=ranger
ranger.service.name=lakehouse
ranger.plugin.config.resource=/etc/trino/ranger-trino-security.xml,/etc/trino/ranger-trino-audit.xml
